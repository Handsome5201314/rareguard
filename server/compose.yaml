services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rareguard
      POSTGRES_USER: rareguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - rareguard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rareguard -d rareguard"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    env_file: runtime/app.env
    environment:
      DATABASE_URL: postgresql+psycopg://rareguard:${POSTGRES_PASSWORD}@database:5432/rareguard
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rareguard_data:
